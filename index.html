<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON 618 - Gargantúa (Optimizado Móvil)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; color: #fff; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #btn-toggle {
            position: absolute; top: 20px; right: 20px; background: rgba(5, 10, 20, 0.7);
            border: 1px solid #ffaa00; color: #ffaa00; padding: 8px 14px; border-radius: 8px;
            cursor: pointer; z-index: 20; font-weight: bold; backdrop-filter: blur(5px);
        }
        
        #ui-panel {
            position: absolute; top: 70px; right: 20px; background: rgba(10, 5, 5, 0.85);
            border: 1px solid rgba(255, 150, 0, 0.4); border-radius: 12px; padding: 18px;
            width: 280px; backdrop-filter: blur(10px); z-index: 10; transition: 0.3s;
            box-shadow: 0 0 30px rgba(255, 100, 0, 0.15);
        }
        #ui-panel.hidden { transform: translateX(120%); opacity: 0; pointer-events: none; }
        
        h1 { font-size: 1.1rem; margin: 0 0 8px 0; color: #ffbc00; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .physics-note { font-size: 0.7rem; color: #cbd5e1; margin-bottom: 15px; font-style: italic; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #e2e8f0; }
        input[type=range] { width: 100%; accent-color: #ff8800; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        button {
            background: linear-gradient(135deg, #ff8c00, #e52d27);
            border: none; color: white; padding: 8px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s;
        }
        button:hover { opacity: 0.8; transform: scale(1.02); }
        .btn-full { grid-column: span 2; }
        .btn-blue { background: linear-gradient(135deg, #1e3c72, #2a5298); }
        
        #info-overlay {
            position: absolute; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.8);
            padding: 12px 18px; border-radius: 8px; font-size: 0.85rem; border-left: 3px solid #ffaa00; pointer-events: none;
            z-index: 5;
        }

        #scale-label {
            position: absolute; color: #00ffff; font-size: 0.75rem; font-weight: bold;
            text-shadow: 0 0 5px #00ffff; pointer-events: none; display: none;
            background: rgba(0,20,40,0.8); padding: 4px 8px; border-radius: 4px; border: 1px solid #00ffff;
            z-index: 5;
        }

        @media (max-width: 768px) {
            #ui-panel { width: 230px; right: 15px; }
            #btn-toggle { right: 15px; }
            #info-overlay { font-size: 0.75rem; max-width: 65vw; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="scale-label">Sistema Solar (Heliosfera)</div>

    <button id="btn-toggle">⚙️ Controles</button>

    <div id="ui-panel">
        <h1>GARGANTÚA</h1>
        <div class="physics-note">Físicas: Órbitas Keplerianas + Doppler Real + TDE</div>
        
        <div class="btn-grid">
            <button id="btn-zoom-in">🔍 Acercar</button>
            <button id="btn-zoom-out">🔍 Alejar</button>
            <button id="btn-solar" class="btn-full btn-blue">🪐 Escala Sistema Solar</button>
            <button id="btn-star" class="btn-full">☄️ Lanzar Gigante Roja</button>
        </div>

        <div class="control-group">
            <label for="timeScale">Velocidad del Tiempo</label>
            <input type="range" id="timeScale" min="0" max="2" step="0.05" value="0.5">
        </div>
    </div>

    <div id="info-overlay">
        <strong>TON 618</strong><br>
        <small style="color: #cbd5e1;">Lado Blanco: Luz acercándose (Doppler)<br>Lado Rojo: Material alejándose.</small>
    </div>

    <!-- Core Libraries (Eliminado EffectComposer por estabilidad) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Configuración Base Robusta
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 35, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.maxDistance = 2000;

        // Textura base generada por código
        function createGasTexture() {
            const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
            const ctx = cv.getContext('2d');
            const gr = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gr.addColorStop(0, 'rgba(255,255,255,1)');
            gr.addColorStop(0.3, 'rgba(255,255,255,0.8)');
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gr; ctx.fillRect(0,0,64,64);
            const tex = new THREE.Texture(cv);
            tex.needsUpdate = true;
            return tex;
        }
        const gasTexture = createGasTexture();

        // 1. EL AGUJERO NEGRO
        const bhRadius = 12; 
        const blackHole = new THREE.Mesh(
            new THREE.SphereGeometry(bhRadius, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x000000 })
        );
        scene.add(blackHole);

        // 2. DISCO DE ACRECIÓN (Con precisión estricta para GPU móvil)
        const diskCount = 60000; 
        const diskGeo = new THREE.BufferGeometry();
        const dPos = new Float32Array(diskCount * 3);
        const dCol = new Float32Array(diskCount * 3);
        const dParams = new Float32Array(diskCount * 2);

        for(let i=0; i<diskCount; i++) {
            const r = bhRadius * 1.1 + Math.pow(Math.random(), 2.5) * 65;
            const angle = Math.random() * Math.PI * 2;
            
            dPos[i*3] = r * Math.cos(angle);
            dPos[i*3+1] = (Math.random() - 0.5) * (r * 0.04); 
            dPos[i*3+2] = r * Math.sin(angle);
            
            dParams[i*2] = r; 
            dParams[i*2+1] = angle;

            const normR = (r - bhRadius) / 65;
            if(normR < 0.1) { dCol[i*3]=1.0; dCol[i*3+1]=0.95; dCol[i*3+2]=0.9; }
            else if(normR < 0.4) { dCol[i*3]=1.0; dCol[i*3+1]=0.5; dCol[i*3+2]=0.1; }
            else { dCol[i*3]=0.6; dCol[i*3+1]=0.1; dCol[i*3+2]=0.0; }
        }
        diskGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
        diskGeo.setAttribute('color', new THREE.BufferAttribute(dCol, 3));
        diskGeo.setAttribute('params', new THREE.BufferAttribute(dParams, 2));

        const diskMat = new THREE.ShaderMaterial({
            uniforms: { 
                time: { value: 0 }, 
                cameraPos: { value: camera.position }, 
                GM: { value: 5000.0 } 
            },
            vertexShader: `
                precision mediump float;
                attribute vec3 color; 
                attribute vec2 params;
                uniform float time; 
                uniform float GM; 
                uniform vec3 cameraPos;
                varying vec3 vColor;
                
                void main() {
                    float r = params.x; 
                    float initialAngle = params.y;
                    
                    float angularVelocity = sqrt(GM / (r*r*r));
                    float currentAngle = initialAngle - (time * angularVelocity);
                    
                    vec3 newPos = vec3(cos(currentAngle)*r, position.y, sin(currentAngle)*r);
                    
                    vec3 velocityDir = normalize(vec3(sin(currentAngle), 0.0, -cos(currentAngle)));
                    vec3 viewDir = normalize(cameraPos - newPos);
                    float dopplerShift = dot(velocityDir, viewDir);
                    
                    vec3 finalColor = color;
                    if(dopplerShift > 0.0) {
                        finalColor += vec3(0.2, 0.4, 0.7) * (dopplerShift * 2.0);
                    } else {
                        finalColor *= (1.0 + dopplerShift * 0.9);
                        finalColor.b *= 0.2;
                    }
                    
                    // Aumento radical del brillo para compensar la falta de Bloom
                    vColor = finalColor * (1.5 + dopplerShift*1.5);
                    
                    vec4 mvPos = modelViewMatrix * vec4(newPos, 1.0);
                    gl_Position = projectionMatrix * mvPos;
                    
                    float distance = length(mvPos.xyz);
                    gl_PointSize = clamp(200.0 / distance, 1.0, 50.0) * (1.0 + r/50.0);
                }
            `,
            fragmentShader: `
                precision mediump float;
                varying vec3 vColor;
                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float ll = length(xy);
                    if (ll > 0.5) discard;
                    
                    float alpha = pow((0.5 - ll) * 2.0, 1.2);
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true, 
            blending: THREE.AdditiveBlending, 
            depthWrite: false
        });
        
        scene.add(new THREE.Points(diskGeo, diskMat));

        // 3. FONDO CÓSMICO
        function createLivingUniverse() {
            const starGeo = new THREE.BufferGeometry();
            const stars = 6000;
            const pos = new Float32Array(stars * 3);
            const cols = new Float32Array(stars * 3);
            for(let i=0; i<stars; i++) {
                const r = 1000 + Math.random() * 3000;
                const th = Math.random() * Math.PI * 2;
                const ph = Math.acos(2 * Math.random() - 1);
                pos[i*3] = r * Math.sin(ph) * Math.cos(th);
                pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
                pos[i*3+2] = r * Math.cos(ph);

                const c = Math.random();
                if(c > 0.8) { cols[i*3]=0.6; cols[i*3+1]=0.8; cols[i*3+2]=1.0; } 
                else if(c > 0.3) { cols[i*3]=1.0; cols[i*3+1]=0.9; cols[i*3+2]=0.7; } 
                else { cols[i*3]=1.0; cols[i*3+1]=0.4; cols[i*3+2]=0.2; } 
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
            
            const starMat = new THREE.PointsMaterial({
                size: 6, vertexColors: true, transparent: true, opacity: 0.8,
                map: gasTexture, blending: THREE.AdditiveBlending, depthWrite: false
            });
            scene.add(new THREE.Points(starGeo, starMat));
        }
        createLivingUniverse();

        // 4. COMPARADOR DE ESCALA
        const solarSystemGroup = new THREE.Group();
        solarSystemGroup.position.set(-35, 0, 0); 
        solarSystemGroup.visible = false;
        
        solarSystemGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 16,16), new THREE.MeshBasicMaterial({color: 0xffff00})));
        
        const helioGeo = new THREE.RingGeometry(1.05, 1.1, 64);
        const helioMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        const helio = new THREE.Mesh(helioGeo, helioMat);
        helio.rotation.x = Math.PI/2;
        solarSystemGroup.add(helio);
        scene.add(solarSystemGroup);

        // 5. FÍSICAS ESTELARES (Gigante Roja)
        let activeStars = [];
        const GM = 5000;

        function spawnRedGiant() {
            const starGroup = new THREE.Group();
            
            const starMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), new THREE.MeshBasicMaterial({color: 0xff3300}));
            starGroup.add(starMesh);

            const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: gasTexture, color: 0xff4400, transparent: true, blending: THREE.AdditiveBlending }));
            glow.scale.set(10,10,1);
            starGroup.add(glow);

            const angle = Math.random() * Math.PI * 2;
            const r0 = 150;
            const pos = new THREE.Vector3(r0*Math.cos(angle), (Math.random()-0.5)*15, r0*Math.sin(angle));
            starGroup.position.copy(pos);
            scene.add(starGroup);

            const vMag = Math.sqrt(GM / (r0 - bhRadius)) * 0.45; 
            const vel = new THREE.Vector3(-Math.sin(angle)*vMag, 0, Math.cos(angle)*vMag);

            activeStars.push({ mesh: starGroup, innerMesh: starMesh, glow: glow, pos: pos, vel: vel, phase: 'orbit' });
        }

        // BUCLE DE ANIMACIÓN (Render nativo)
        let clock = new THREE.Clock();
        let globalTime = 0;
        let timeScale = 0.5;
        const scaleLabel = document.getElementById('scale-label');

        function animate() {
            requestAnimationFrame(animate);
            let delta = Math.min(clock.getDelta(), 0.1); 
            globalTime += delta * timeScale;
            
            diskMat.uniforms.time.value = globalTime;
            diskMat.uniforms.cameraPos.value.copy(camera.position);

            for(let i = activeStars.length - 1; i >= 0; i--) {
                let star = activeStars[i];
                let rVec = star.pos.clone();
                let r = rVec.length();

                let forceMag = GM / Math.pow(Math.max(0.1, r - bhRadius), 2);
                let accel = rVec.normalize().multiplyScalar(-forceMag);
                
                star.vel.add(accel.multiplyScalar(delta * timeScale));
                star.pos.add(star.vel.clone().multiplyScalar(delta * timeScale));
                star.mesh.position.copy(star.pos);

                if (star.phase === 'orbit' && r < 35) star.phase = 'tde';
                else if (star.phase === 'tde') {
                    star.innerMesh.scale.z += delta * 15 * timeScale; 
                    star.innerMesh.scale.x = Math.max(0.1, star.innerMesh.scale.x - delta * 2 * timeScale); 
                    star.innerMesh.scale.y = star.innerMesh.scale.x;
                    
                    const dir = star.vel.clone().normalize();
                    star.innerMesh.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), dir), 0.5);

                    star.innerMesh.material.color.lerp(new THREE.Color(0x88ccff), delta * 2 * timeScale);
                    star.glow.material.color.lerp(new THREE.Color(0x88ccff), delta * 2 * timeScale);

                    if(r < bhRadius + 2) {
                        star.innerMesh.material.transparent = true;
                        star.innerMesh.material.opacity -= delta * 4 * timeScale;
                        star.glow.material.opacity -= delta * 4 * timeScale;
                    }

                    if(r < bhRadius || star.innerMesh.material.opacity <= 0) {
                        scene.remove(star.mesh);
                        activeStars.splice(i, 1);
                    }
                }
            }

            if(solarSystemGroup.visible) {
                const vector = solarSystemGroup.position.clone();
                vector.project(camera);
                scaleLabel.style.left = `${(vector.x * .5 + .5) * window.innerWidth}px`;
                scaleLabel.style.top = `${(vector.y * -.5 + .5) * window.innerHeight - 30}px`;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // CONTROLES UI
        document.getElementById('btn-toggle').addEventListener('click', () => document.getElementById('ui-panel').classList.toggle('hidden'));
        document.getElementById('timeScale').addEventListener('input', (e) => timeScale = parseFloat(e.target.value));
        
        document.getElementById('btn-zoom-in').addEventListener('click', () => camera.position.setLength(Math.max(controls.minDistance, camera.position.length() * 0.7)));
        document.getElementById('btn-zoom-out').addEventListener('click', () => camera.position.setLength(Math.min(controls.maxDistance, camera.position.length() * 1.4)));
        
        document.getElementById('btn-solar').addEventListener('click', () => {
            solarSystemGroup.visible = !solarSystemGroup.visible;
            scaleLabel.style.display = solarSystemGroup.visible ? 'block' : 'none';
        });
        document.getElementById('btn-star').addEventListener('click', spawnRedGiant);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
